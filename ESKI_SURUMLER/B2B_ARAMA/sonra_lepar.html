        function closeWinChangePassword() {
            $find("popupChangePassword").hide();
        }

        // TextBoxlardaki Enter key i için eklendi.
        function keyPressedLogin(e) {
            var key;
            if (window.event)
                key = window.event.keyCode;     //IE
            else
                key = e.which;     //firefox

            if (key == 13) {
                var btn = document.getElementById("btnLogin");
                if (btn != null) {
                    btn.click();
                    e.preventDefault();
                }
            }
        }

        // TextBoxlardaki Enter key i için eklendi.
        function keyPressedChangePassword(e) {
            var key;
            if (window.event)
                key = window.event.keyCode;     //IE
            else
                key = e.which;     //firefox

            if (key == 13) {
                var btn = document.getElementById("btnChangePassword");

                if (btn != null) {
                    btn.click();
                    e.preventDefault();
                }
            }
        }
